<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ses Butonu</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: white;
    }

    .play-btn {
      padding: 20px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
      transition: transform 0.1s, background-color 0.2s;
      user-select: none;
    }

    .play-btn:hover {
      background-color: #0056b3;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    #durum {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Buton -->
  <button class="play-btn" onclick="sesCal()">Sesi Çal 🎵</button>
  <div id="durum"></div>

  <!-- Catbox MP3 Linki -->
  <audio id="sesMedyasi" src="https://files.catbox.moe/g8btrd.mp3" preload="auto"></audio>

  <script>
    function sesCal() {
      const ses = document.getElementById('sesMedyasi');
      const durum = document.getElementById('durum');
      
      durum.innerText = "Yükleniyor / Çalınıyor...";
      ses.currentTime = 0;

      // Tarayıcı oynatma izni sözünü (promise) kontrol et
      const playPromise = ses.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          durum.innerText = "Ses çalıyor 🔊";
        }).catch(error => {
          console.error("Hata:", error);
          durum.innerText = "Hata: Ses çalınamadı. Sayfaya bir kez tıklayıp tekrar deneyin.";
        });
      }
    }
  </script>

</body>
</html>
