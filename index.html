<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ses Butonu</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .play-btn {
      width: 90%;
      max-width: 400px;
      padding: 30px 20px;
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
      background-color: #e50914;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(229, 9, 20, 0.5);
      user-select: none;
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .uyari {
      margin-top: 20px;
      font-size: 16px;
      color: #ffcc00;
      font-weight: bold;
    }

    #durum {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Buton -->
  <button class="play-btn" onclick="sesCal()">SESİ ÇAL 🔊</button>

  <div class="uyari">⚠️ Sonuna kadar sesini aç, sonra butona bas!</div>
  <div id="durum"></div>

  <!-- Sadece depodaki ses.mp3 dosyasını bağladık -->
  <audio id="sesMedyasi" src="ses.mp3" loop></audio>

  <script>
    function sesCal() {
      const ses = document.getElementById('sesMedyasi');
      const durum = document.getElementById('durum');

      ses.currentTime = 0;
      
      ses.play().then(() => {
        durum.innerText = "Ses çalıyor 🔁🔊";
      }).catch(error => {
        durum.innerText = "Hata: " + error.message;
      });
    }
  </script>

</body>
</html>
